});

function persistRead()   { flushStateToCSV(); _stateDirty = true; showSaveBar(); }
function persistStars()  { flushStateToCSV(); _stateDirty = true; showSaveBar(); }
function persistLists()  { flushStateToCSV(); _stateDirty = true; showSaveBar(); }
function paperKey(p) { return p.id; }
function paperInAnyList(k) { return Object.values(libraryLists).some(arr => arr.includes(k)); }
function listCount() { return Object.values(libraryLists).reduce((n, arr) => n + arr.length, 0); }

/* ===== LOAD ===== */
// Normalize line endings before parsing — PapaParse auto-detects newline
// style from the first row and will mis-parse files with MIXED CRLF/LF
// endings, absorbing rows into adjacent field values.
function normalizeNewlines(text) { return (text || '').replace(/\r\n?/g, '\n'); }
// The raw CDN sometimes stalls on the cache-busted 2 MB papers file instead of failing,
// which would leave the page on the skeleton forever; give up after this long.
const CSV_FETCH_TIMEOUT_MS = 8000;
async function fetchNormalized(url) {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), CSV_FETCH_TIMEOUT_MS);
    try {
      const res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
      if (!res.ok) throw new Error('fetch failed: ' + res.status);
      return normalizeNewlines(await res.text());
    } finally {
      clearTimeout(timer);
    }
  } catch (err) {
    // Fallback: if we tried to fetch from the GitHub raw CDN and it failed or timed out
    // (network down, offline, CDN stall), retry from the local relative path.
    if (CSV_BASE_URL && typeof url === 'string' && url.startsWith(CSV_BASE_URL)) {
      // Strip base + cache-buster querystring to recover the bare filename.
      const rel = url.slice(CSV_BASE_URL.length).split('?')[0];
      const res = await fetch(rel, { cache: 'no-store' });
      if (!res.ok) throw new Error('fetch failed: ' + res.status);
      return normalizeNewlines(await res.text());
    }
    throw err;
  }
}
function loadPapers() {
  fetchNormalized(csvUrl('papers_database.csv')).then(text => {
    const r = Papa.parse(text, { header: true, skipEmptyLines: true, newline: '\n' });
    allPapers = r.data.filter(p => p.title && p.title.trim());
    restorePapersFromBackup();
    bootstrapStateFromCSV();
    updateLibraryBadge();
    applyHash();
    revealContent();
  }).catch(err => {
    document.getElementById('topStories').innerHTML = '<div class="empty-state">Could not load papers_database.csv</div>';
    toastError('Could not load papers — ' + (err && err.message ? err.message : 'network error'));
    revealContent();
  });
}
function loadInterests() {
  fetchNormalized(csvUrl('interests_database.csv')).then(text => {
    const r = Papa.parse(text, { header: true, skipEmptyLines: true, newline: '\n' });
    allInterests = r.data.filter(i => i.interest_name && i.interest_name.trim());
    _loadedInterestNames = allInterests.map(i => i.interest_name);
    const b = readBackup();
    if (b && b.interests) { allInterests = mergeBackupRows(allInterests, b.interests, 'interest_name'); _interestsDirty = true; announceRestore(b); }
    updateInterestsBadge();
    renderInterests();
  }).catch(err => {
    toastError('Could not load interests — ' + (err && err.message ? err.message : 'network error'));
  });
}
function loadGroups() {
  const groupsUrl = csvUrl('groups_database.csv');
  const onComplete = r => {
    allGroups = r.data.filter(g => g.group_name && g.group_name.trim());
    _loadedGroupNames = allGroups.map(g => g.group_name);
    const b = readBackup();
    if (b && b.groups) { allGroups = mergeBackupRows(allGroups, b.groups, 'group_name'); _groupsDirty = true; announceRestore(b); }
    buildGroupOrder();
    updateInterestsBadge();
    renderInterests();
  };
  const reportFail = err => {
    const detail = err && err.message ? err.message : 'network error';
    toastError('Could not load groups — ' + detail);
  };
  Papa.parse(groupsUrl, {
    download: true, header: true, skipEmptyLines: true, delimiter: '|',
    complete: onComplete,
    error: err => {
      // Fallback to local relative path if the GitHub raw fetch failed.
      if (CSV_BASE_URL && groupsUrl.startsWith(CSV_BASE_URL)) {
        Papa.parse('groups_database.csv', {
          download: true, header: true, skipEmptyLines: true, delimiter: '|',
          complete: onComplete,
          error: reportFail
        });
      } else {
        reportFail(err);
      }
    }
  });
}
function buildGroupOrder() {
  GROUP_ORDER = allGroups
    .filter(g => g.status === 'confirmed')
    .sort((a,b) => parseInt(a.display_order||99) - parseInt(b.display_order||99))
    .map(g => norm(g.group_name));
}

/* [2] Skeleton -> content reveal */
function revealContent() {
  if (_dataLoaded) return;

/* ===== HELPERS ===== */
/* Group identity color: first 8 confirmed groups (display_order) get a slot, the rest stay neutral */
function groupColor(g) {
  const i = GROUP_ORDER.indexOf(g);
  return i >= 0 && i < 8 ? `var(--g${i + 1})` : 'var(--g-other)';
}
function gdot(g) { return `<i class="gdot" style="--gc:${groupColor(g)}" aria-hidden="true"></i>`; }

/* "Alert: Tomlin. High — CBFs + diffusion ... [residual -1: ...]" -> { reason, source } */
function parseWhy(p) {
  let n = (p.notes || '').replace(/\s+/g, ' ').trim();
  if (!n) return null;
  let source = '';
  const a = n.match(/^Alert:\s*([^.]+)\.\s*/i);
  if (a) { source = a[1].replace(/\s*\(.*?\)\s*/g, ' ').replace(/\bcitations?\b/ig, '').trim(); n = n.slice(a[0].length); }
  n = n.replace(/\[residual[^\]]*\]?/ig, '').trim();
  const t = n.match(/^(Core|High|Moderate|Low|Medium)\b\s*[—–-]+\s*/i);
  if (t) n = n.slice(t[0].length);
  n = n.replace(/\s*[—–]\s*$/, '').trim();
  if (!n) return null;
  return { reason: n.charAt(0).toUpperCase() + n.slice(1), source };
}
function whyHTML(p, cls) {
  const w = parseWhy(p);
  if (!w) return '';
  return `<p class="why ${cls||''}">${esc(w.reason)}${w.source ? ` <span class="why-src">From your ${esc(w.source)} alert</span>` : ''}</p>`;
}

  ['Automatica', '', 'journal', /Automatica/i],
];
const V_PREPRINT = { arxiv: 'arXiv', engrxiv: 'engrXiv', hal: 'HAL', openreview: 'OpenReview' };
function _venueOf(p) {
  const raw = (p.venue || '').trim();
  const vy = (raw.match(/\b(20\d{2})\b/) || [])[1];
  const py = (String(p.publishing_date || '').match(/\b(20\d{2})\b/) || [])[1];
  const year = parseInt(vy || py) || null;
  const out = (name, full, kind) => ({ name, full: full || '', kind, year });
  if (!raw || raw === 'not specified') return out('Unknown venue', '', 'other');
  if (/ph\.?\s?d|thesis|dissertation/i.test(raw)) return out('Theses', 'PhD theses and dissertations', 'other');
  const known = VENUES.find(v => v[3].test(raw));
  if (/workshop/i.test(raw) && !/Algorithmic Foundations/i.test(raw)) {
    const conf = VENUES.find(v => v[2] === 'conference' && v[3].test(raw));
    return conf ? out(`${conf[0]} Workshops`, `Workshops at ${conf[0]}`, 'workshop') : out('Other workshops', 'Standalone and unlisted workshops', 'workshop');
  }
  if (/submitted|submission/i.test(raw)) {
    const k = Object.keys(V_PREPRINT).find(k => raw.toLowerCase().includes(k)) || 'arxiv';
    return out(V_PREPRINT[k], 'Preprint, under submission', 'preprint');
  }
  if (known) return out(known[0], known[1], known[2]);
  const pre = Object.keys(V_PREPRINT).find(k => raw.toLowerCase().includes(k));
  if (pre || /^preprint$/i.test(raw)) return out(pre ? V_PREPRINT[pre] : 'Other preprints', '', 'preprint');

/* Build relevance breakdown inner HTML (used in hover popup) */
function buildRelevanceBreakdown(p) {
  const mi = (p.matched_interests || '').split('|').map(s => s.trim()).filter(Boolean);
  const residual = parseInt(p.residual_score) || 0;
  const rel = dynamicRelevance(p);
  const finalScore = REL_SCORE[rel] || 1;

  let html = '<div class="relevance-breakdown">';

  // Score row
  html += `<div class="relevance-score-row">
    <span class="relevance-score-val sc-${finalScore}">${finalScore}</span>
    <span class="relevance-score-label"><strong>${relLabel(rel)}</strong><br>${rel === 'definitely' ? 'Directly relevant to your research' : rel === 'probably' ? 'Related to your interests' : 'Tangentially connected'}</span>
  </div>`;

  // Matched interests with their scores
  if (mi.length) {
    let maxBase = 0;
    const scores = [];
    const rows = mi.map(name => {
      const i = allInterests.find(x => x.interest_name === name);
      const confirmed = i && i.status === 'confirmed';
      const rm = confirmed ? (i.relevance_mapping || 'mildly') : 'mildly';
      const sc = REL_SCORE[rm] || 1;
      scores.push(sc);
      if (confirmed && sc > maxBase) maxBase = sc;
      const statusNote = !i ? ' (unknown)' : !confirmed ? ` (${i.status})` : '';
      return `<div class="relevance-interest-row">
        <span class="badge badge-${rm} relevance-interest-score">${sc}</span>
        <span class="relevance-interest-name">${esc(name)}${statusNote}</span>
      </div>`;
    }).join('');
    html += `<div class="relevance-interests"><div class="relevance-interests-title">Matched Interests</div>${rows}</div>`;

    // Formula
    const clamped = Math.max(1, Math.min(3, maxBase + residual));
    const scoreList = scores.join(', ');
    html += `<div class="relevance-formula">max(${scoreList}) + ${residual >= 0 ? residual : '(' + residual + ')'} = ${maxBase + residual}${(maxBase + residual) !== clamped ? ' \u2192 clamped to ' + clamped : ''}</div>`;
  } else {
    html += `<div class="relevance-interests"><div class="relevance-interests-title">Matched Interests</div><div style="font-size:13px;color:var(--text-muted);font-style:italic;">No matched interests \u2014 using static fallback (${esc(p.relevance_tier || 'mildly')})</div></div>`;
  }

  // Residual score
  const resClass = residual === 0 ? 'zero' : '';
  const resSign = residual > 0 ? '+' + residual : residual < 0 ? String(residual) : '0';
  html += `<div class="relevance-residual ${resClass}"><strong>Residual: ${resSign}</strong> \u2014 ${residual > 0 ? 'Boosted: more relevant than interests alone suggest' : residual < 0 ? 'Reduced: less relevant than interests alone suggest' : 'No adjustment'}</div>`;

  // Triage notes
  const notes = (p.notes || '').trim();
  if (notes) {
    html += `<div class="relevance-notes">${esc(notes)}</div>`;
  }

  html += '</div>';
  return html;
}

/* Sort: relevance tier first, then published year descending (newest first) */
function sortPapers(arr) {
  return arr.sort((a,b) => {
    const r = (REL_ORDER[dynamicRelevance(a)] ?? 9) - (REL_ORDER[dynamicRelevance(b)] ?? 9);
    if (r !== 0) return r;
    const ya = parseInt(a.publishing_date)||0, yb = parseInt(b.publishing_date)||0;
    if (ya !== yb) return yb - ya;
    return (b.date_found || '').localeCompare(a.date_found || '');
  });
}

  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  const paperTabs = ['all','email'];
  document.getElementById('sec-papers').classList.toggle('active', paperTabs.includes(tab));

  document.getElementById('sec-venues').classList.toggle('active', tab === 'venues');

    card, id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, axis: null,
    hold: setTimeout(() => {

/* Act on a card without re-rendering the feed, which would lose the reader's place */
function tokAct(ev, btn, what, k) {
  ev.stopPropagation();
  _tokLock = true;
  if (what === 'star') { toggleStar(k, btn); btn.classList.toggle('on-star', starSet.has(k)); }
  else if (what === 'read') { toggleRead(k, btn); btn.classList.toggle('on-read', readSet.has(k)); btn.setAttribute('aria-label', readSet.has(k) ? 'Mark unread' : 'Mark read'); }
  else { openSaveDD(btn, k); }
  _tokLock = false;
}

/* ===== RENDER PAPERS ===== */
function renderPapers(papers) {
  if (!papers.length) {
    document.getElementById('topStories').innerHTML = '<div class="empty-state">No papers match your filters.</div>';
    document.getElementById('topicsGrid').innerHTML = '';
    return;
  }
  sortPapers(papers);
  const top = selectTopPapers(papers);
  renderTopPapers(top);
  // Papers already shown above; topic cards prefer papers the reader hasn't seen yet
  const shownAbove = new Set(top.slice(0, MAX_TOP_CARDS).map(paperKey));

  const grouped = {};
  const _confirmedGroups = new Set(allGroups.filter(g => g.status === 'confirmed').map(g => norm(g.group_name)));
  papers.forEach(p => { (p.theme_groups||'').split('|').map(norm).filter(g => !_confirmedGroups.size || _confirmedGroups.has(g)).forEach(g => { if (g && (!_confirmedGroups.size || _confirmedGroups.has(g))) { if (!grouped[g]) grouped[g]=[]; grouped[g].push(p); } }); });
  Object.values(grouped).forEach(a => sortPapers(a));
  const sorted = Object.keys(grouped).sort((a,b) => {
    const ia=GROUP_ORDER.indexOf(a), ib=GROUP_ORDER.indexOf(b);
    return (ia===-1?999:ia)-(ib===-1?999:ib);
  });

  document.getElementById('topicsGrid').innerHTML = sorted.map(name => {
    const items = grouped[name];
    // Fill each card with papers not shown above or in an earlier card; fall back to
    // repeats only when a group has nothing else left, so cards are never empty.
    const fresh = items.filter(p => !shownAbove.has(paperKey(p)));
    const shown = fresh.slice(0, MAX_TOPIC_ITEMS);
    if (shown.length < MAX_TOPIC_ITEMS) {
      for (const p of items) {
        if (shown.length >= MAX_TOPIC_ITEMS) break;
        if (!shown.includes(p)) shown.push(p);
      }
    }
    shown.forEach(p => shownAbove.add(paperKey(p)));
    const extra = items.length - shown.length;
    return `<div class="topic-card" style="--gc:${groupColor(name)}">
      <div class="topic-title" onclick="openGroup('${escAttr(name)}')">${gdot(name)}<span class="topic-label">${esc(name)}</span>
        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        <span class="topic-extra">${extra > 0 ? `View all ${items.length}` : `${items.length} ${items.length === 1 ? 'paper' : 'papers'}`}</span>
      </div>
      <div class="topic-body feed-body">${shown.map(feedItemHTML).join('')}</div>
    </div>`;
  }).join('');
}

/* Stacked bar of this week's additions by topic; groups past the 8 color slots fold into "Other" */
function renderWeekPulse(weekPapers) {
  const el = document.getElementById('weekPulse');
  if (!weekPapers.length) { el.innerHTML = ''; return; }
  const counts = {};
  weekPapers.forEach(p => groupsOfPaper(p).forEach(g => counts[g] = (counts[g] || 0) + 1));
  const ordered = GROUP_ORDER.filter(g => counts[g]);
  const colored = ordered.filter(g => GROUP_ORDER.indexOf(g) < 8);
  const otherN = ordered.filter(g => GROUP_ORDER.indexOf(g) >= 8).reduce((n, g) => n + counts[g], 0);
  const items = colored.map(g => ({ g, n: counts[g] }));
  if (otherN) items.push({ g: null, n: otherN });
  if (!items.length) { el.innerHTML = ''; return; }
  const seg = it => `<div class="pulse-seg" style="flex-grow:${it.n};--gc:${it.g ? groupColor(it.g) : 'var(--g-other)'}" data-g="${escAttr(it.g || '')}" data-tip="${escAttr((it.g || 'Other topics') + ': ' + it.n)}" ${it.g ? `onclick="openGroup('${escAttr(it.g)}')"` : ''}></div>`;
  const key = it => it.g
    ? `<button class="pulse-key" onclick="openGroup('${escAttr(it.g)}')" onmouseenter="pulseHL('${escAttr(it.g)}')" onmouseleave="pulseHL(null)">${gdot(it.g)}${esc(it.g)} <span class="n">${it.n}</span></button>`
    : `<span class="pulse-key static">${gdot('')}Other <span class="n">${it.n}</span></span>`;
  el.innerHTML = `
    <div class="pulse-cap"><b>${weekPapers.length} ${weekPapers.length === 1 ? 'paper' : 'papers'}</b> arrived this week, by topic</div>
    <div class="pulse-bar" role="img" aria-label="${escAttr(items.map(it => (it.g || 'Other') + ' ' + it.n).join(', '))}">${items.map(seg).join('')}</div>
    <div class="pulse-legend">${items.map(key).join('')}</div>`;
}
function pulseHL(g) {
  const el = document.getElementById('weekPulse');
  el.classList.toggle('hl', !!g);
  el.querySelectorAll('.pulse-seg').forEach(s => s.classList.toggle('on', s.dataset.g === g));
}

function toggleDetail(btn, type) {
  const card = btn.closest('.top-card, .topic-item');

/* ===== ABSTRACT POPUP ===== */
let _absPopup = null, _absBtn = null;
function toggleAbsPopup(btn, key) {
  if (_absPopup && _absBtn === btn) { closeAbsPopup(); return; }
  closeAbsPopup();
  const p = allPapers.find(x => paperKey(x) === key);
  if (!p || !p.abstract) return;
  const rect = btn.getBoundingClientRect();
  const popup = document.createElement('div');
  popup.className = 'abs-popup';
  popup.onclick = e => e.stopPropagation();
  popup.innerHTML = `<div class="abs-popup-header"><span class="abs-popup-title">Abstract</span><button class="abs-popup-close" onclick="event.stopPropagation();closeAbsPopup()" title="Close">&times;</button></div><div class="abs-popup-body">${esc(p.abstract)}</div>`;
  document.body.appendChild(popup);
  const pW = popup.offsetWidth, pH = popup.offsetHeight;
  const gap = 6, pad = 8;
  const vw = window.innerWidth, vh = window.innerHeight;
  /* Vertical: prefer below, flip above if no room, clamp as last resort */
  let top;
  if (rect.bottom + gap + pH <= vh) top = rect.bottom + gap;
  else if (rect.top - gap - pH >= 0) top = rect.top - gap - pH;
  else top = Math.max(pad, vh - pH - pad);
  /* Horizontal: center on button, clamp to viewport */
  let left = rect.left + rect.width / 2 - pW / 2;
  if (left < pad) left = pad;
  if (left + pW > vw - pad) left = vw - pW - pad;
  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
  _absPopup = popup;
  _absBtn = btn;
}
function closeAbsPopup() {
  if (_absPopup) { _absPopup.remove(); _absPopup = null; _absBtn = null; }
}

function buildDDItems(key) {
  const names = Object.keys(libraryLists);

  return names.map(n => {
    const inList = libraryLists[n].includes(key);

function createListFromDD(input, key) {
  const name = input.value.trim();
  if (!name) return;
  if (name.includes('|')) { toast('List name cannot contain "|"'); input.select(); return; }
  if (!libraryLists[name]) libraryLists[name] = [];
  if (!libraryLists[name].includes(key)) libraryLists[name].push(key);

document.getElementById('mainScroll').addEventListener('scroll', () => { closeSaveDD(); closeAbsPopup(); closeVenueTooltip(); closeRelevancePopup(); }, { passive: true });

function toggleStar(k, btn) {

/* ----- Venues tab ----- */
const V_KINDS = [['conference', 'Conferences'], ['journal', 'Journals'], ['workshop', 'Workshops'], ['preprint', 'Preprints'], ['other', 'Theses and other']];
function renderVenues() {
  const byVenue = {};
  allPapers.forEach(p => {
    const v = venueOf(p);
    const e = byVenue[v.name] || (byVenue[v.name] = { name: v.name, full: v.full, kind: v.kind, n: 0, years: {} });
    e.n++;
    if (v.year) e.years[v.year] = (e.years[v.year] || 0) + 1;
  });
  const venues = Object.values(byVenue);
  const peer = venues.filter(v => v.kind === 'conference' || v.kind === 'journal');
  const peerN = peer.reduce((n, v) => n + v.n, 0);
  document.getElementById('venuesNote').textContent =
    `${peerN} papers from ${peer.length} conferences and journals, plus workshops and preprints. Pick a venue for all its papers, or a year for one edition.`;
  document.getElementById('venuesContent').innerHTML = V_KINDS.map(([kind, label]) => {
    const list = venues.filter(v => v.kind === kind).sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
    if (!list.length) return '';
    const max = list[0].n, total = list.reduce((n, v) => n + v.n, 0);
    const row = v => {
      const years = Object.keys(v.years).sort((a, b) => b - a);

        ? years.map(y => `<button class="tl-chip" onclick="event.stopPropagation();openVenue('${escAttr(v.name)}',${y})">${y}<span class="n">${v.years[y]}</span></button>`).join('')
        : '';

        <div class="v-bar"><i style="width:${Math.max(v.n / max * 100, 2)}%"></i></div>
        <div class="v-count">${v.n}</div>
        <div class="v-years">${chips}</div>
      </div>`;
    };
    return `<section class="v-section">
      <div class="v-section-head"><h3>${label}</h3><span class="count">${total} ${total === 1 ? 'paper' : 'papers'}</span><span class="rule"></span></div>
      ${list.map(row).join('')}

  }).join('');
}

function openVenue(name, year, skipHash) {
  const key = VENUE_KEY + name;
  if (_overlayGroupName === key && _venueYear === (year || null) && document.getElementById('overlay').classList.contains('open')) return;
  _overlayGroupName = key;
  _venueYear = year || null;
  setOverlayTopMode(true);
  renderVenueList();
  document.getElementById('overlayBody').scrollTop = 0;
  if (!skipHash) location.hash = venueHash(name, _venueYear);
  openOverlay();
}
function venueHash(name, year) { return '#venue/' + encodeURIComponent(name) + (year ? '/' + year : ''); }
function setVenueYear(y) {
  _venueYear = y;
  renderVenueList();
  document.getElementById('overlayBody').scrollTop = 0;
  history.replaceState(null, '', venueHash(_overlayGroupName.slice(VENUE_KEY.length), y));
}
function renderVenueList() {
  const name = _overlayGroupName.slice(VENUE_KEY.length);
  const all = allPapers.filter(p => venueOf(p).name === name);
  const visible = hideRead ? all.filter(p => !readSet.has(paperKey(p))) : all;
  const counts = {};
  visible.forEach(p => { const y = venueOf(p).year; if (y) counts[y] = (counts[y] || 0) + 1; });
  const years = Object.keys(counts).sort((a, b) => b - a).map(Number);
  if (_venueYear && !counts[_venueYear]) _venueYear = null;
  const inYear = p => !_venueYear || venueOf(p).year === _venueYear;
  const papers = sortForList(visible.filter(inYear));
  const full = all.length ? venueOf(all[0]).full : '';
  document.getElementById('overlayTitle').textContent = `${name}${_venueYear ? ' ' + _venueYear : ''}`;
  setListProgress(all.filter(inYear));
  if (full) document.getElementById('overlaySub').textContent = `${full}. ` + document.getElementById('overlaySub').textContent;
  const chip = (y, label, n) => `<button class="tl-chip ${_venueYear === y ? 'active' : ''}" onclick="setVenueYear(${y === null ? 'null' : y})">${label}<span class="n">${n}</span></button>`;
  document.getElementById('overlayToolbar').innerHTML = years.length > 1
    ? `<div class="tl-chips" role="toolbar" aria-label="Filter by year">${chip(null, 'All years', visible.length)}${years.map(y => chip(y, y, counts[y])).join('')}</div>`
    : '';
  document.getElementById('overlayHeaderTools').innerHTML = sortToolsHTML();
  document.getElementById('overlayBody').innerHTML = papers.length
    ? paperListHTML(papers, { sections: true })
    : '<div class="tl-empty">No papers from this venue match your current filters.</div>';
}

function renderGroupList(name) {
  const inGroup = p => (p.theme_groups||'').split('|').map(norm).includes(name);
  const papers = sortForList(applyViewFilters(allPapers.filter(inGroup)));
  document.getElementById('overlayTitle').textContent = name;
  setListProgress(applyViewFilters(allPapers.filter(inGroup), true));
  document.getElementById('overlayToolbar').innerHTML = '';
  document.getElementById('overlayHeaderTools').innerHTML = sortToolsHTML();
  document.getElementById('overlayBody').innerHTML = papers.length
    ? paperListHTML(papers, { sections: true, hideGroup: name })
    : '<div class="tl-empty">No papers in this group match your current filters.</div>';
}
/* Same filters as the main feed (tab, relevance pill, hide-read) */
function applyViewFilters(papers, ignoreRead) {
  if (currentTab === 'email') papers = papers.filter(p => (p.source_mode||'').includes('email'));
  if (currentRel !== 'all') papers = papers.filter(p => dynamicRelevance(p) === currentRel);
  if (hideRead && !ignoreRead) papers = papers.filter(p => !readSet.has(paperKey(p)));
  return papers;
}
const TOP_LIST_KEY = '#top-list';  // sentinel for _overlayGroupName; can't collide with a group name
let _topSort = 'added';   // 'added' | 'published'
let _topGroup = null;     // normalized group name, or null for all
function setOverlayTopMode(on) {
  document.querySelector('#overlay .overlay-content').classList.toggle('top-mode', on);
  if (!on) { document.getElementById('overlaySub').textContent = ''; document.getElementById('overlayToolbar').innerHTML = ''; document.getElementById('overlayHeaderTools').innerHTML = ''; }
}
function openTopList(skipHash) {
  if (_overlayGroupName === TOP_LIST_KEY && document.getElementById('overlay').classList.contains('open')) return;
  _overlayGroupName = TOP_LIST_KEY;
  setOverlayTopMode(true);
  renderTopList();

function setTopSort(v) { _topSort = v; renderOpenList(); document.getElementById('overlayBody').scrollTop = 0; }
/* Re-render whichever overlay list is open (top papers or a category) */
function renderOpenList(keepScroll) {
  if (!_overlayGroupName) return false;
  const body = document.getElementById('overlayBody'), st = body.scrollTop;
  if (_overlayGroupName === TOP_LIST_KEY) renderTopList();
  else if (_overlayGroupName.startsWith(VENUE_KEY)) renderVenueList();

function setTopGroup(g) { _topGroup = g; renderTopList(); document.getElementById('overlayBody').scrollTop = 0; }

const _MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
/* "Mar 2026" -> 202603, "2026" -> 202600 */
function pubKey(p) {
  const s = (p.publishing_date||'').trim().toLowerCase();
  const y = parseInt((s.match(/\d{4}/)||[])[0]) || 0;
  const m = _MONTHS.indexOf(s.slice(0,3)) + 1;
  return y * 100 + Math.max(m, 0);
}
function addedBucket(d) {
  if (!d) return { key: '0', label: 'Date unknown' };
  const days = Math.floor((new Date() - new Date(d + 'T00:00:00')) / 86400000);
  if (days < 7) return { key: 'w0', label: 'This week' };
  if (days < 14) return { key: 'w1', label: 'Last week' };
  return { key: d.slice(0,7), label: new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', year: 'numeric' }) };
}
function publishedBucket(p) {
  const k = pubKey(p);
  if (!k) return { key: '0', label: 'Date unknown' };
  const y = Math.floor(k / 100), m = k % 100;
  if (!m) return { key: String(k), label: `${y}, month unknown` };
  return { key: String(k), label: new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }) };
}

/* Confirmed theme groups a paper belongs to */
function groupsOfPaper(p) {
  const confirmed = new Set(allGroups.filter(g => g.status === 'confirmed').map(g => norm(g.group_name)));
  return (p.theme_groups||'').split('|').map(norm).filter(g => g && (!confirmed.size || confirmed.has(g)));
}

/* Rows with the reading rail, optionally split into date sections. Shared by the
   Top Papers list, category overlays, Library and search. */
function paperListHTML(papers, opts) {
  const o = opts || {};
  const row = p => topRowHTML(p, groupsOfPaper(p).filter(g => g !== o.hideGroup));
  if (!o.sections) {
    requestAnimationFrame(markTruncatedVenues);
    return `<div class="paper-list flat"><section class="tl-section">${papers.map(row).join('')}</section></div>`;
  }
  const sections = [];
  papers.forEach(p => {
    const b = _topSort === 'added' ? addedBucket(p.date_found) : publishedBucket(p);
    const last = sections[sections.length - 1];
    if (last && last.key === b.key) last.items.push(p); else sections.push({ ...b, items: [p] });
  });
  return `<div class="paper-list">${sections.map(s => `
    <section class="tl-section">
      <div class="tl-section-head"><h4>${esc(s.label)}</h4><span class="count">${s.items.length}</span><span class="rule"></span></div>
      ${s.items.map(row).join('')}
    </section>`).join('')}</div>`;
}

/* Read progress in the overlay header; counts read papers even when they are filtered out */
function setListProgress(everyPaper) {
  const total = everyPaper.length, read = everyPaper.filter(p => readSet.has(paperKey(p))).length;
  document.getElementById('overlaySub').textContent = total
    ? `${read} of ${total} read${hideRead && read ? ', read papers hidden' : ''}` : '';
  const prog = document.getElementById('overlayProgress');
  prog.firstElementChild.style.width = total ? `${Math.max(read / total * 100, read ? 1 : 0)}%` : '0';
  prog.setAttribute('aria-valuenow', read); prog.setAttribute('aria-valuemax', total);
}
function sortToolsHTML() {
  return `<div class="tl-sort" role="group" aria-label="Sort">
      <button class="${_topSort==='added'?'active':''}" onclick="setTopSort('added')">Recently added</button>
      <button class="${_topSort==='published'?'active':''}" onclick="setTopSort('published')">Newest published</button>
    </div>`;
}
function sortForList(papers) {
  if (_topSort === 'added') papers.sort((a,b) => (b.date_found||'').localeCompare(a.date_found||'') || pubKey(b) - pubKey(a));
  else papers.sort((a,b) => pubKey(b) - pubKey(a) || (b.date_found||'').localeCompare(a.date_found||''));
  return papers;
}

function renderTopList() {
  const groupsOf = groupsOfPaper;
  const base = selectTopPapers(sortPapers(applyViewFilters(allPapers.slice())));

  // Chips: only groups that have papers in the current top set
  const counts = {};
  base.forEach(p => groupsOf(p).forEach(g => counts[g] = (counts[g]||0) + 1));
  if (_topGroup && !counts[_topGroup]) _topGroup = null;
  const chipNames = Object.keys(counts).sort((a,b) => {
    const ia = GROUP_ORDER.indexOf(a), ib = GROUP_ORDER.indexOf(b);
    return (ia===-1?999:ia) - (ib===-1?999:ib);
  });
  const chip = (g, label, n) => `<button class="tl-chip ${_topGroup===g?'active':''}" onclick="setTopGroup(${g===null?'null':`'${escAttr(g)}'`})">${g ? gdot(g) : ''}${esc(label)}<span class="n">${n}</span></button>`;
  document.getElementById('overlayToolbar').innerHTML =
    `<div class="tl-chips" role="toolbar" aria-label="Filter by group">${chip(null, 'All groups', base.length)}${chipNames.map(g => chip(g, g, counts[g])).join('')}</div>`;
  document.getElementById('overlayHeaderTools').innerHTML = sortToolsHTML();

  const papers = sortForList(_topGroup ? base.filter(p => groupsOf(p).includes(_topGroup)) : base.slice());
  let everyTop = selectTopPapers(sortPapers(applyViewFilters(allPapers.slice(), true)));
  if (_topGroup) everyTop = everyTop.filter(p => groupsOf(p).includes(_topGroup));
  document.getElementById('overlayTitle').textContent = _topGroup ? `Top Papers in ${_topGroup}` : 'Top Papers';
  setListProgress(everyTop);

  const body = document.getElementById('overlayBody');
  body.innerHTML = papers.length
    ? paperListHTML(papers, { sections: true, hideGroup: _topGroup })
    : `<div class="tl-empty">No top papers match your current filters.${_topGroup ? `<br><button class="tl-chip" onclick="setTopGroup(null)">Show all groups</button>` : ''}</div>`;
}

function topRowHTML(p, groups) {
  const k = paperKey(p), ir = readSet.has(k);
  const hasSummary = p.summary && p.summary.trim() && p.summary !== 'not specified';
  const hasAbstract = p.abstract && p.abstract.trim() && p.abstract !== 'not specified';
  const showTitle = p.headline && p.headline.trim() && p.headline.trim() !== (p.title||'').trim();
  const venue = p.venue && p.venue !== 'not specified' ? p.venue : '';
  return `<article class="topic-item top-row ${ir?'is-read':''}" onclick="openPaper('${escAttr(k)}', event)">
    <div class="tr-main">
      <div class="tr-headline">${esc(p.headline||p.title)}</div>
      ${showTitle ? `<div class="tr-title" title="${escAttr(p.title)}">${esc(p.title)}</div>` : ''}
      <div class="tr-line">
        ${p.authors && p.authors!=='not specified' ? `<span class="tr-authors">${esc(p.authors)}</span>` : ''}
        ${groups.length && groups.length < 4 ? `<span class="tr-groups">${groups.map(g => `<span class="tr-group">${gdot(g)}${esc(g)}</span>`).join('')}</span>` : ''}
      </div>
    </div>
    <div class="tr-side">
      ${venue ? venueLinkHTML(p, 'tr-venue') : ''}
      <span>${starSet.has(k) ? '<span class="tr-star" title="Starred">&#9733;</span> ' : ''}${esc(displayDate(p))}</span>
    </div>
    <div class="tr-actions"><div>
      ${whyHTML(p)}
      <div class="p-action-row">${summaryBtn(p)} ${absBtn(p)} ${linkBtn(p)} <span class="p-actions has-active">${starBtn(p)} ${readBtn(p)} ${saveBtn(p)} ${deleteBtn(p)}</span></div>
      <div class="p-detail-panel" data-summary="${hasSummary?dataAttr(p.summary):''}" data-abstract="${hasAbstract?dataAttr(p.abstract):''}"></div>
    </div></div>
  </article>`;
}
function openOverlay() {
  const ol = document.getElementById('overlay');
  ol.classList.remove('closing');
  ol.classList.add('open');
  document.getElementById('mainScroll').style.overflow = 'hidden';
}
function closeOverlay(skipHistory) {
  const ol = document.getElementById('overlay');
  if (!ol.classList.contains('open')) return;
  _overlayGroupName = null;
  ol.classList.add('closing');
  const onEnd = () => {
    ol.classList.remove('open', 'closing');
    document.getElementById('mainScroll').style.overflow = '';
    ol.removeEventListener('transitionend', onEnd);
  };
  ol.addEventListener('transitionend', onEnd);
  /* fallback if transition doesn't fire */
  setTimeout(() => { ol.classList.remove('open', 'closing'); document.body.style.overflow = ''; }, 350);
  /* Navigate back to the tab if the user closed the overlay directly (not via hash change) */
  if (!skipHistory && (location.hash.startsWith('#group/') || location.hash.startsWith('#venue/') || location.hash === '#top')) {
    history.back();
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeRelevancePopup(); closeOverlay(); closeAbsPopup(); closeSaveDD(); closeLoginModal(); _resolveGeneric(null); } });

/* ===== LIBRARY ===== */
let _collapsedLibGroups = new Set(['all', 'read']);
function toggleLibGroup(headerEl, key) {
  const group = headerEl.closest('.interest-group');
  group.classList.toggle('collapsed');
  if (group.classList.contains('collapsed')) _collapsedLibGroups.add(key);
  else _collapsedLibGroups.delete(key);
}
function libGroupHTML(key, icon, label, papers, extra) {
  const collapsed = _collapsedLibGroups.has(key) ? ' collapsed' : '';
  const body = papers.length ? paperListHTML(papers) : '<div class="library-list-empty">No papers in this list</div>';
  return `<div class="interest-group${collapsed}"><div class="interest-group-inner"><div class="interest-group-header" onclick="toggleLibGroup(this,'${escAttr(key)}')">${icon} ${esc(label)} <span class="interest-group-count">${papers.length}</span>${extra||''}<svg class="chevron" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></div><div class="interest-group-body">${body}</div></div></div>`;
}
function renderLibrary() {
  const starred = allPapers.filter(p => starSet.has(paperKey(p)));
  const read = allPapers.filter(p => readSet.has(paperKey(p)));
  sortPapers(read);
  const listNames = Object.keys(libraryLists);
  const noted = allPapers.filter(p => p.user_notes && p.user_notes.trim());
  sortPapers(noted);

  let html = '';
  if (!allPapers.length) {
    html = '<div class="library-empty">No papers in the database yet.</div>';
  } else {
    if (starred.length) html += libGroupHTML('starred', '&#9733;', 'Starred', starred);
    if (noted.length) html += libGroupHTML('noted', '&#128221;', 'Notes', noted);
    listNames.forEach(name => {
      const papers = allPapers.filter(p => libraryLists[name].includes(paperKey(p)));
      const actions = `<span class="library-actions" onclick="event.stopPropagation()"><button onclick="renameList('${escAttr(name)}')">Rename</button><button onclick="showCopyDD(this,'${escAttr(name)}')">Copy to...</button><button class="danger" onclick="deleteList('${escAttr(name)}')">Delete</button></span>`;
      html += libGroupHTML('list-'+name, '&#9776;', name, papers, actions);
    });
    if (read.length) html += libGroupHTML('read', '&#10003;', 'Read', read);
    const MON = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
    function pubDateVal(p) {
      const s = (p.publishing_date||'').trim().toLowerCase();
      const m = s.match(/^([a-z]+)\s+(\d{4})$/);
      if (m) return parseInt(m[2])*12 + (MON[m[1]]||0);
      const y = parseInt(s); return y ? y*12 : 0;
    }
    const allSorted = allPapers.slice().sort((a,b) => {
      const d = pubDateVal(b) - pubDateVal(a);
      if (d !== 0) return d;
      const r = (REL_ORDER[dynamicRelevance(a)]??9) - (REL_ORDER[dynamicRelevance(b)]??9);
      if (r !== 0) return r;
      return (a.title||'').localeCompare(b.title||'');
    });
    html += libGroupHTML('all', '&#128218;', 'All', allSorted);
  }
  document.getElementById('libraryContent').innerHTML = html;
}

/* Library list management */
async function createNewList() {
  if (!isAuthed()) { requireAuth(() => createNewList()); return; }
  const name = await showPrompt('New list', null, 'List name');
  if (!name) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  if (trimmed.includes('|')) { toast('List name cannot contain "|"'); return; }
  if (libraryLists[trimmed]) { toast('A list with that name already exists'); return; }
  libraryLists[trimmed] = [];
  persistLists(); updateLibraryBadge();
  toast(`Created "${trimmed}"`);
  renderLibrary();
}
async function renameList(oldName) {
  const newName = await showPrompt('Rename list', null, 'List name', oldName);
  if (!newName || newName === oldName) return;
  if (libraryLists[newName]) { toast('A list with that name already exists'); return; }
  libraryLists[newName] = libraryLists[oldName];
  delete libraryLists[oldName];
  persistLists();
  toast(`Renamed to "${newName}"`);
  renderLibrary();
}
async function deleteList(name) {
  const ok = await showConfirm(`Delete "${name}"?`, `Papers won't be removed from the database.`, 'Delete', true);
  if (!ok) return;
  delete libraryLists[name];
  persistLists(); updateLibraryBadge();
  toast(`Deleted "${name}"`);
  renderLibrary();
}

/* Copy-to dropdown (positioned next to button) */
let _copyDD = null;
function closeCopyDD() { if (_copyDD) { _copyDD.remove(); _copyDD = null; } }
function showCopyDD(btn, srcName) {
  closeCopyDD();
  const otherLists = Object.keys(libraryLists).filter(n => n !== srcName);
  const dd = document.createElement('div');
  dd.className = 'copy-dd';
  dd.onclick = e => e.stopPropagation();
  let items = '';
  if (otherLists.length) {
    items = otherLists.map(n => `<div class="copy-dd-item" onclick="event.stopPropagation();doCopyList('${escAttr(srcName)}','${escAttr(n)}')">${esc(n)}</div>`).join('');
  }
  items += `<div class="copy-dd-item" style="border-top:1px solid var(--border);color:var(--accent)" onclick="event.stopPropagation();doCopyNew('${escAttr(srcName)}')">+ New list...</div>`;
  dd.innerHTML = items;
  const rect = btn.getBoundingClientRect();
  dd.style.position = 'fixed';
  dd.style.top = (rect.bottom + 4) + 'px';
  dd.style.left = rect.left + 'px';
  document.body.appendChild(dd);
  _copyDD = dd;
}
function doCopyList(srcName, targetName) {
  const added = libraryLists[srcName].filter(k => !libraryLists[targetName].includes(k));
  libraryLists[targetName].push(...added);
  persistLists();
  toast(`Copied ${added.length} paper${added.length!==1?'s':''} to "${targetName}"`);
  closeCopyDD();
  renderLibrary();
}
async function doCopyNew(srcName) {
  closeCopyDD();
  const name = await showPrompt('New list name', null, 'List name');
  if (!name) return;
  const trimmed = name.trim();
  if (trimmed.includes('|')) { toast('List name cannot contain "|"'); return; }
  if (!libraryLists[trimmed]) libraryLists[trimmed] = [];
  const added = libraryLists[srcName].filter(k => !libraryLists[trimmed].includes(k));
  libraryLists[trimmed].push(...added);
  persistLists(); updateLibraryBadge();
  toast(`Copied ${added.length} paper${added.length!==1?'s':''} to "${trimmed}"`);
  renderLibrary();
}
document.addEventListener('click', () => closeCopyDD());

/* ===== INTERESTS ===== */
let _collapsedGroups = new Set();
function toggleInterestGroup(headerEl, cat) {
  const group = headerEl.closest('.interest-group');
  if (_collapsedGroups.has(cat)) {
    _collapsedGroups.delete(cat);
    group.classList.remove('collapsed');
  } else {
    _collapsedGroups.add(cat);
    group.classList.add('collapsed');
  }
}
function switchIGTab(tab, fromHash) {
  currentIGTab = tab;
  document.querySelectorAll('.ig-toggle-btn').forEach(b => b.classList.toggle('active', b.dataset.igtab === tab));
  if (!fromHash) location.hash = '#interests/' + tab;
  const items = tab === 'interests' ? allInterests : allGroups;
  if (currentIStatus !== 'all' && !items.some(x => x.status === currentIStatus)) {
    currentIStatus = 'all';
    document.querySelectorAll('#interestChips .pill').forEach(c => c.classList.toggle('active', c.dataset.istatus === 'all'));
  }
  renderInterests();
}
function toggleIStatus(s) {
  currentIStatus = s;
  document.querySelectorAll('#interestChips .pill').forEach(c => c.classList.toggle('active', c.dataset.istatus === s));
  renderInterests();
}
let _interestsAutoSwitched = false;
function renderInterests() {
  if (!_interestsAutoSwitched && currentIStatus === 'suggested') {
    const items = currentIGTab === 'interests' ? allInterests : allGroups;
    if (!items.some(x => x.status === 'suggested')) {
      _interestsAutoSwitched = true;
      currentIStatus = 'all';
      document.querySelectorAll('#interestChips .pill').forEach(c => c.classList.toggle('active', c.dataset.istatus === 'all'));
    }
  }
  const main = document.getElementById('interestsMain');
  if (currentIGTab === 'groups') { renderGroupsTab(main); return; }
  let interests = allInterests;
  if (currentIStatus !== 'all') interests = interests.filter(i => i.status === currentIStatus);
  if (!interests.length) { main.innerHTML = '<div class="empty-state">No interests match.</div>'; return; }
  const grouped = {};
  interests.forEach(i => { const c = i.category==='method'?'Methods':'Application Areas'; if (!grouped[c]) grouped[c]=[]; grouped[c].push(i); });
  const so = {suggested:0,confirmed:1,rejected:2};
  const ro = {definitely:0,probably:1,mildly:2};
  const po = {core:0,high:1,key:2,medium:3,'low-moderate':4};
  const r = (map,k) => k in map ? map[k] : 9;
  Object.values(grouped).forEach(a => a.sort((x,y)=> r(so,x.status)-r(so,y.status) || r(ro,x.relevance_mapping)-r(ro,y.relevance_mapping) || r(po,x.priority_level)-r(po,y.priority_level)));
  const sugN = allInterests.filter(i=>i.status==='suggested').length;
  let html = '';
  if (sugN > 0 && currentIStatus === 'all') html += `<div style="padding:12px 20px;margin-bottom:16px;background:var(--purple-bg);border:1px solid var(--purple);border-radius:8px;font-size:13px;color:var(--purple);">${sugN} suggested interest${sugN>1?'s':''} from recent papers</div>`;
  ['Application Areas','Methods'].forEach(cat => {
    if (!grouped[cat]) return;
    const collapsed = _collapsedGroups.has(cat) ? ' collapsed' : '';
    html += `<div class="interest-group${collapsed}"><div class="interest-group-inner"><div class="interest-group-header" onclick="toggleInterestGroup(this,'${escAttr(cat)}')">${cat==='Methods'?'\u{1F527}':'\u{1F3AF}'} ${cat} <span class="interest-group-count">${grouped[cat].length}</span><svg class="chevron" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></div><div class="interest-group-body">${grouped[cat].map(interestCardHTML).join('')}</div></div></div>`;
  });
  main.innerHTML = html;
}
function renderGroupsTab(main) {
  let groups = allGroups;
  if (currentIStatus !== 'all') groups = groups.filter(g => g.status === currentIStatus);
  if (!groups.length) { main.innerHTML = '<div class="empty-state">No topics match.</div>'; return; }
  const so = {suggested:0,confirmed:1,rejected:2};

function groupCardHTML(g) {
  const paperCount = allPapers.filter(p => (p.theme_groups||'').split('|').map(norm).includes(norm(g.group_name))).length;
  const notes = g.notes ? `<div class="interest-detail" style="font-style:italic">${esc(g.notes)}</div>` : '';

/* ===== GROUP DRAG & DROP ===== */
let _draggedGroup = null;
let _dragCounters = new WeakMap();
function gDragStart(e) {
  _draggedGroup = e.currentTarget.dataset.group;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function gDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function gDragEnter(e) {
  e.preventDefault();
  const card = e.currentTarget;
  const c = (_dragCounters.get(card) || 0) + 1;
  _dragCounters.set(card, c);
  if (card.dataset.group !== _draggedGroup) card.classList.add('drag-over');
}
function gDragLeave(e) {
  const card = e.currentTarget;
  const c = (_dragCounters.get(card) || 1) - 1;
  _dragCounters.set(card, c);
  if (c <= 0) { card.classList.remove('drag-over'); _dragCounters.delete(card); }
}
function gDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  _dragCounters.delete(e.currentTarget);
  const target = e.currentTarget.dataset.group;
  if (!_draggedGroup || _draggedGroup === target) return;
  if (!isAuthed()) { requireAuth(() => {}); return; }
  /* Reorder: move dragged group to target's position */
  const so = {suggested:0,confirmed:1,rejected:2};
  const ordered = [...allGroups].sort((a,b) => (so[a.status] ?? 9) - (so[b.status] ?? 9) || (parseInt(a.display_order)||999) - (parseInt(b.display_order)||999));
  const fromIdx = ordered.findIndex(g => g.group_name === _draggedGroup);
  const toIdx = ordered.findIndex(g => g.group_name === target);
  if (fromIdx < 0 || toIdx < 0) return;
  const prevOrder = {};
  allGroups.forEach(g => { prevOrder[g.group_name] = g.display_order; });
  const [moved] = ordered.splice(fromIdx, 1);
  ordered.splice(toIdx, 0, moved);
  ordered.forEach((g, i) => { g.display_order = String(i + 1); });
  buildGroupOrder();
  _groupsDirty = true;
  showSaveBar();
  renderInterests();
  toast('Topic order updated', () => {
    allGroups.forEach(g => { if (prevOrder[g.group_name] != null) g.display_order = prevOrder[g.group_name]; });
    buildGroupOrder();
    _groupsDirty = true;
    renderInterests();
  });
}
function gDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  _draggedGroup = null;
  document.querySelectorAll('.interest-card.drag-over').forEach(el => el.classList.remove('drag-over'));
}

let _toastTimer = null;
let _toastUndo = null;
function toast(msg, undoFn, opts) {

  if (undoFn) {

/* Push changed files directly to GitHub via Contents API.
   Requires a fine-grained PAT stored in localStorage under 'gh_pat'.
   Scopes needed: Contents (read + write) on this repo only. */
const GH_OWNER  = 'sumanth-tangirala';
const GH_REPO   = 'scholar-dashboard';
const GH_BRANCH = 'main';

async function _ghPushFile(headers, filename, content, message) {
  const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${filename}`;
  const getRes = await fetch(`${apiUrl}?ref=${GH_BRANCH}&_=${Date.now()}`, { headers, cache: 'no-store' });
  if (!getRes.ok) throw new Error(`GitHub GET ${filename} failed: ${getRes.status}`);
  const { sha } = await getRes.json();
  const b64 = btoa(unescape(encodeURIComponent(content)));
  const putRes = await fetch(apiUrl, {
    method: 'PUT', headers: { ...headers, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, content: b64, sha, branch: GH_BRANCH })
  });
  if (!putRes.ok) {
    const err = await putRes.json().catch(() => ({}));
    if (putRes.status === 401) { localStorage.removeItem('gh_pat'); throw new Error('Invalid PAT — cleared. Try again.'); }
    throw new Error(err.message || `GitHub PUT ${filename} failed: ${putRes.status}`);
  }
}

async function pushToGitHub() {
  if (!isAuthed()) { requireAuth(() => pushToGitHub()); return; }
  if (!_stateDirty && !_interestsDirty && !_groupsDirty) return;

  let pat = localStorage.getItem('gh_pat');
  if (!pat) {
    pat = await showPrompt(
      'GitHub Personal Access Token',
      'Fine-grained PAT with Contents read+write access. Stored in your browser — only sent to api.github.com.',
      'Paste PAT here'
    );
    if (!pat) return;
    localStorage.setItem('gh_pat', pat);
  }

  const btn = document.getElementById('btnPushGH');
  const origText = btn.textContent;
  btn.textContent = 'Pushing…'; btn.disabled = true;

  const headers = { 'Authorization': `Bearer ${pat}`, 'Accept': 'application/vnd.github+json' };
  try {
    if (_stateDirty)
      await _ghPushFile(headers, 'papers_database.csv', Papa.unparse(allPapers), 'Update papers_database.csv from dashboard');
    if (_interestsDirty)
      await _ghPushFile(headers, 'interests_database.csv', Papa.unparse(allInterests), 'Update interests_database.csv from dashboard');
    if (_groupsDirty)
      await _ghPushFile(headers, 'groups_database.csv', Papa.unparse(allGroups, {delimiter:'|'}), 'Update groups_database.csv from dashboard');

    _stateDirty = false; _interestsDirty = false; _groupsDirty = false;
    clearBackup();
    _loadedPaperFields = new Map(allPapers.map(p => [p.id, paperFields(p)]));
    _loadedInterestNames = allInterests.map(i => i.interest_name);
    _loadedGroupNames = allGroups.map(g => g.group_name);
    hideSaveBar();
    toast('Saved to GitHub ✓');
  } catch (e) {
    toast('Push failed: ' + e.message);
    console.error(e);
  } finally {
    btn.textContent = origText; btn.disabled = false;
  }
}

      ${hasText(p.venue) ? venueLinkHTML(p, 'pd-venue') : ''}
      ${paperDate(p) ? `<span>${esc(paperDate(p))}</span>` : ''}
      <span class="f-rel rel-${rel}"><i></i>${relLabel(rel)}</span>
    </div>
    <h1 class="pd-title">${esc(p.title)}</h1>
    ${dek}
    ${hasText(p.authors) ? `<div class="pd-authors">${esc(p.authors)}</div>` : ''}
    ${whyHTML(p)}
  </header>`;

  // Reading column
  let main = '';
  if (hasText(p.summary)) main += `<section class="pd-section"><h2>Summary</h2><p class="pd-prose">${esc(p.summary)}</p></section>`;
  if (hasText(p.abstract)) main += `<section class="pd-section"><h2>Abstract</h2><p class="pd-prose">${esc(p.abstract)}</p></section>`;
  if (hasNotes) main += `<section class="pd-section pd-notes"><h2>Your notes <button class="pd-edit" onclick="toggleNotesModal('${ka}')">Edit</button></h2><p class="pd-prose">${esc(p.user_notes)}</p></section>`;
  if (!main) main = `<p class="pd-empty">No summary or abstract yet. Open the paper to read it at the source.</p>`;

  // Side panel: facts + editable topics
  const sm = p.source_mode || '';
  const via = sm.includes('email') && sm.includes('web_survey') ? 'Email alert and web survey'
    : sm.includes('email') ? 'Email alert' : sm.includes('web_survey') ? 'Web survey' : '';
  const matches = (p.matched_interests || '').split('|').map(x => x.trim()).filter(Boolean);
  const facts = [];
  if (hasText(p.venue)) facts.push(['Venue', `${venueLinkHTML(p, '')}${p.venue.trim() !== venueLabel(v) ? `<span class="pd-sub">${esc(p.venue)}</span>` : ''}`]);
  if (paperDate(p)) facts.push(['Published', esc(paperDate(p))]);
  if (p.date_found) facts.push(['Added', esc(shortDate(p.date_found))]);
  if (via) facts.push(['Found via', `${via}${why && why.source ? `<span class="pd-sub">${esc(why.source)} alert</span>` : ''}`]);
  facts.push(['Relevance', `<span class="f-rel rel-${rel}"><i></i>${relLabel(rel)}</span><span class="triage-anchor" onmouseenter="showRelevancePopup(this,'${ka}')" onmouseleave="hideRelevancePopup(this)"><button class="pd-info" title="How this was scored" aria-label="How this was scored" aria-expanded="false" onclick="toggleRelevancePopup(event,this.parentElement,'${ka}')">&#9432;</button></span>`]);
  if (matches.length) facts.push(['Matches', `<span class="pd-matches">${matches.map(m => `<span class="pd-match">${esc(m)}</span>`).join('')}</span>`]);

  const groups = (p.theme_groups||'').split('|').map(x => x.trim()).filter(Boolean);
  const x = `<svg width="10" height="10" viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="8" y1="2" x2="2" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
  const topics = groups.map(g => `<span class="badge badge-group badge-group-edit">${gdot(norm(g))}${esc(g)}<span class="group-remove" title="Remove topic" onclick="event.stopPropagation();removeGroupFromPaper('${ka}','${escAttr(g)}')">${x}</span></span>`).join('');
  const addBtn = `<span class="group-add-wrap"><button class="group-add-btn" onclick="event.stopPropagation();toggleGroupAddDD(this,'${ka}')">+ Add</button><div class="group-add-dd"></div></span>`;

  const aside = `<aside class="pd-aside">
    <div class="pd-card"><dl class="pd-facts">${facts.map(([t, d]) => `<dt>${t}</dt><dd>${d}</dd>`).join('')}</dl></div>
    <div class="pd-card"><h3>Topics</h3><div class="pd-topics paper-detail-tags">${topics}${addBtn}</div></div>
  </aside>`;

  // Related: unread papers from the same topics, no paper shown twice
  const seen = new Set([k]);
  let related = '';
  [...new Set(groups.map(norm))].forEach(g => {
    const inGroup = allPapers.filter(pp => paperKey(pp) !== k && (pp.theme_groups||'').split('|').map(norm).includes(g));
    const fresh = sortPapers(inGroup.filter(pp => !readSet.has(paperKey(pp)) && !seen.has(paperKey(pp)))).slice(0, 4);
    if (!fresh.length) return;
    fresh.forEach(pp => seen.add(paperKey(pp)));
    related += `<div class="pd-rel-group">
      <div class="pd-rel-head">${gdot(g)}<h3>${esc(g)}</h3><button class="pd-rel-all" onclick="openGroup('${escAttr(g)}')">View all ${inGroup.length + 1}</button></div>
      <div class="pd-rel-grid">${fresh.map(feedItemHTML).join('')}</div>
    </div>`;
  });

  document.getElementById('paperDetail').innerHTML = `<div class="pd">${bar}
    <article class="pd-article">
      ${head}
      <div class="pd-body"><div class="pd-main">${main}</div>${aside}</div>
      ${related ? `<section class="pd-related"><h2>Related papers</h2>${related}</section>` : ''}
    </article>
  </div>`;

  if (!renderPaperDetail._scrollHooked) {
    document.getElementById('mainScroll').addEventListener('scroll', updatePaperBar, { passive: true });
    renderPaperDetail._scrollHooked = true;
  }
  updatePaperBar();
}
/* Show the title in the sticky bar once the page heading has scrolled under it */
function updatePaperBar() {
  if (!_paperViewActive) return;
  const bar = document.querySelector('.pd-bar'), h = document.querySelector('.pd-title');
  if (bar && h) bar.classList.toggle('stuck', h.getBoundingClientRect().bottom < bar.getBoundingClientRect().bottom);
}

function removeGroupFromPaper(key, groupName) {
  if (!isAuthed()) { requireAuth(() => removeGroupFromPaper(key, groupName)); return; }
  const p = allPapers.find(pp => paperKey(pp) === key);
  if (!p) return;
  const groups = (p.theme_groups||'').split('|').map(s => s.trim()).filter(g => g && g !== groupName);
  p.theme_groups = groups.join('|');
  _stateDirty = true; showSaveBar(); refresh();
  renderPaperDetail(p);
}

function addGroupToPaper(key, groupName) {
  if (!isAuthed()) { requireAuth(() => addGroupToPaper(key, groupName)); return; }
  const p = allPapers.find(pp => paperKey(pp) === key);
  if (!p) return;
  const groups = (p.theme_groups||'').split('|').map(s => s.trim()).filter(Boolean);
  if (groups.includes(groupName)) return;
  groups.push(groupName);
  p.theme_groups = groups.join('|');
  _stateDirty = true; showSaveBar(); refresh();
  renderPaperDetail(p);
}

let _relPopupTimer = null;
function showRelevancePopup(anchor, key, pinned) {
  // touch screens fire a fake hover on tap; there the tap (toggleRelevancePopup) is the only way in
  if (!pinned && !window.matchMedia('(hover: hover)').matches) return;
  clearTimeout(_relPopupTimer);
  closeRelevancePopup();
  const p = allPapers.find(pp => paperKey(pp) === key);
  if (!p) return;
  const rect = anchor.getBoundingClientRect();
  const popup = document.createElement('div');
  popup.className = 'relevance-popup';
  popup.setAttribute('role', 'dialog');
  popup.setAttribute('aria-label', 'How this paper was scored');
  if (pinned) popup.dataset.pinned = '1';
  popup.innerHTML = buildRelevanceBreakdown(p);
  // Keep it on-screen: fit the width to narrow screens, and open upward when there's no room below
  const w = Math.min(360, window.innerWidth - 24);
  popup.style.width = w + 'px';
  popup.style.left = Math.max(12, Math.min(rect.right - w, window.innerWidth - w - 12)) + 'px';
  popup.style.top = (rect.bottom + 8) + 'px';
  popup.addEventListener('mouseenter', () => clearTimeout(_relPopupTimer));
  popup.addEventListener('mouseleave', () => { if (!popup.dataset.pinned) _relPopupTimer = setTimeout(() => popup.remove(), 150); });
  popup.addEventListener('click', e => e.stopPropagation());
  document.body.appendChild(popup);
  // Below if it fits, else above if it fits, else the roomier side, shortened to fit (it scrolls inside).
  // Never over the (i) button itself, or the next click would land on the pop-up instead.
  const h = popup.getBoundingClientRect().height;
  const below = window.innerHeight - rect.bottom - 16, above = rect.top - 16;
  if (h > below) {
    if (h <= above || above > below) {
      const fit = Math.min(h, above);
      popup.style.maxHeight = fit + 'px';
      popup.style.top = (rect.top - 8 - fit) + 'px';
    } else {
      popup.style.maxHeight = below + 'px';
    }
  }
  const btn = anchor.querySelector('button');
  if (btn) btn.setAttribute('aria-expanded', 'true');
}
function hideRelevancePopup(anchor) {
  _relPopupTimer = setTimeout(() => {
    document.querySelectorAll('.relevance-popup:not([data-pinned])').forEach(el => el.remove());
    if (!document.querySelector('.relevance-popup')) document.querySelectorAll('.pd-info[aria-expanded]').forEach(b => b.setAttribute('aria-expanded', 'false'));
  }, 150);
}
/* Click or tap the (i) button: opens the breakdown and keeps it open until a click outside, scroll or Esc */
function toggleRelevancePopup(ev, anchor, key) {
  ev.stopPropagation();
  const open = document.querySelector('.relevance-popup[data-pinned]');
  if (open) { closeRelevancePopup(); return; }
  showRelevancePopup(anchor, key, true);
}
function closeRelevancePopup() {
  document.querySelectorAll('.relevance-popup').forEach(el => el.remove());
  document.querySelectorAll('.pd-info[aria-expanded]').forEach(b => b.setAttribute('aria-expanded', 'false'));
}

function sanitizeNote(s) { return s.replace(/\|/g, '/').replace(/,/g, ';').replace(/\r\n|\r|\n/g, ' // ').replace(/"/g, "'"); }
function desanitizeNote(s) { return s.replace(/ \/\/ /g, '\n'); }

function saveNote(key, value) {
  const p = allPapers.find(pp => paperKey(pp) === key);
  if (!p) return;
  const sanitized = sanitizeNote(value.trim());
  if ((p.user_notes||'') === sanitized) return;
  p.user_notes = sanitized;
  _stateDirty = true; showSaveBar();
}

function deleteNote() {
  if (!_notesKey) return;
  const p = allPapers.find(pp => paperKey(pp) === _notesKey);
  if (!p) return;
  clearTimeout(_notesSaveTimer);
  const prev = p.user_notes || '';
  const area = document.getElementById('notesModalArea');
  if (!prev && !area.value.trim()) { closeNotesModal(); return; }   // nothing to delete
  p.user_notes = '';
  area.value = '';
  _stateDirty = true; showSaveBar();
  renderPaperDetail(p);
  closeNotesModal();
  toast('Note deleted', () => {
    p.user_notes = prev;
    _stateDirty = true; showSaveBar();
    if (_paperViewActive) renderPaperDetail(p);
  });
}
/* Footer shows "Saved" after typing, and offers delete only when there is something to delete */
function updateNotesFooter(saved) {
  const area = document.getElementById('notesModalArea');
  document.getElementById('notesDelete').hidden = !area.value.trim();
  const st = document.getElementById('notesStatus');
  st.textContent = saved ? 'Saved in this browser' : (area.value.trim() ? 'Saving…' : '');
}

let _notesSaveTimer = null;
function debouncedSaveNote() {
  clearTimeout(_notesSaveTimer);
  _notesSaveTimer = setTimeout(() => {
    if (!_notesKey) return;
    saveNote(_notesKey, document.getElementById('notesModalArea').value);
    const p = allPapers.find(pp => paperKey(pp) === _notesKey);
    if (p) renderPaperDetail(p);
    updateNotesFooter(true);
  }, 300);
}

let _notesKey = null;
function toggleNotesModal(key) {
  if (!isAuthed()) { requireAuth(() => toggleNotesModal(key)); return; }
  const modal = document.getElementById('notesModal');
  if (_notesKey === key && modal.classList.contains('open')) { closeNotesModal(); return; }
  _notesKey = key;
  const p = allPapers.find(pp => paperKey(pp) === key);
  const area = document.getElementById('notesModalArea');
  area.value = desanitizeNote(p?.user_notes || '');
  modal.classList.add('open');
  updateNotesFooter();
  document.getElementById('notesStatus').textContent = '';
  area.focus();
}
function closeNotesModal() {
  const modal = document.getElementById('notesModal');
  if (!modal.classList.contains('open')) return;
  const area = document.getElementById('notesModalArea');
  if (_notesKey) {
    saveNote(_notesKey, area.value);
    const p = allPapers.find(pp => paperKey(pp) === _notesKey);
    if (p) renderPaperDetail(p);
  }
  modal.classList.remove('open');
  _notesKey = null;
}

/* Draggable + resizable notes modal */
(function() {
  let mode = null, ox = 0, oy = 0, startW = 0, startH = 0, startLeft = 0, startTop = 0;
  function toLeftTop(modal) {
    if (modal.style.right !== 'auto') {
      const rect = modal.getBoundingClientRect();
      modal.style.left = rect.left + 'px';
      modal.style.top = rect.top + 'px';
      modal.style.right = 'auto';
      modal.style.bottom = 'auto';
    }
  }
  document.addEventListener('mousedown', e => {
    const modal = document.getElementById('notesModal');
    if (!modal.classList.contains('open')) return;
    if (e.target.closest('#notesResizeHandle')) {
      mode = 'resize';
      toLeftTop(modal);
      const rect = modal.getBoundingClientRect();
      ox = e.clientX; oy = e.clientY;
      startW = rect.width; startH = rect.height; startLeft = rect.left;
      modal.style.transition = 'none';
      e.preventDefault();
    } else if (e.target.closest('#notesModalDrag')) {
      mode = 'drag';
      toLeftTop(modal);
      const rect = modal.getBoundingClientRect();
      ox = e.clientX - rect.left; oy = e.clientY - rect.top;
      modal.style.transition = 'none';
      e.preventDefault();
    }
  });
  document.addEventListener('mousemove', e => {
    if (!mode) return;
    const modal = document.getElementById('notesModal');
    if (mode === 'drag') {
      modal.style.left = (e.clientX - ox) + 'px';
      modal.style.top = (e.clientY - oy) + 'px';
    } else if (mode === 'resize') {
      const dx = ox - e.clientX;
      const dy = e.clientY - oy;
      const newW = Math.max(240, startW + dx);
      const newH = Math.max(180, startH + dy);
      modal.style.width = newW + 'px';
      modal.style.height = newH + 'px';
      modal.style.left = (startLeft - (newW - startW)) + 'px';
    }
  });
  document.addEventListener('mouseup', () => { mode = null; });
})();

function toggleGroupAddDD(btn, key) {
  const dd = btn.nextElementSibling;
  const wasOpen = dd.classList.contains('open');
  document.querySelectorAll('.group-add-dd.open').forEach(d => d.classList.remove('open'));
  if (wasOpen) return;
  const p = allPapers.find(pp => paperKey(pp) === key);
  const current = new Set((p?.theme_groups||'').split('|').map(s => s.trim()).filter(Boolean));
  const confirmed = allGroups.filter(g => g.status === 'confirmed').sort((a,b) => (parseInt(a.display_order)||999) - (parseInt(b.display_order)||999));
  dd.innerHTML = confirmed.map(g => {
    const has = current.has(g.group_name);
    return `<div class="group-opt ${has?'disabled':''}" onclick="event.stopPropagation();addGroupToPaper('${escAttr(key)}','${escAttr(g.group_name)}')">${esc(g.group_name)}</div>`;
  }).join('');
  dd.classList.add('open');
  const close = (e) => { if (!dd.contains(e.target) && e.target !== btn) { dd.classList.remove('open'); document.removeEventListener('click', close); } };
  setTimeout(() => document.addEventListener('click', close), 0);
}

function paperBack() {
  _paperViewActive = false;
  if (history.length > 1) {
    history.back();
  } else {
    location.hash = '#all';
  }
}

/* ===== HASH-BASED ROUTING ===== */
const VALID_TABS = ['all', 'email', 'venues', 'library', 'interests'];
function applyHash() {
  const hash = location.hash.slice(1); // remove '#'

  // Paper detail route
  if (hash.startsWith('paper/')) {
    const id = decodeURIComponent(hash.slice(6));
    if (id) { showPaperDetail(id); return; }
  }

  // Clear paper view state if navigating away; restore scroll position
  const wasInPaper = _paperViewActive;
  _paperViewActive = false;
  document.getElementById('sec-paper').classList.remove('active');
  if (wasInPaper) {
    requestAnimationFrame(() => {
      const ms = document.getElementById('mainScroll');
      ms.style.scrollBehavior = 'auto';
      ms.scrollTop = _savedScrollTop;
      ms.style.scrollBehavior = '';
    });
  }

  // Group overlay route — restore underlying tab first so feed is visible behind overlay
  if (hash.startsWith('group/')) {
    const groupName = decodeURIComponent(hash.slice(6));
    if (groupName) {
      const paperTabs = ['all','email'];
      if (paperTabs.includes(currentTab)) {
        document.getElementById('sec-papers').classList.add('active');
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === currentTab));
      }
      openGroup(groupName, true);
      return;
    }
  }

  // Venue overlay route: #venue/<name> or #venue/<name>/<year>
  if (hash.startsWith('venue/')) {
    const parts = hash.slice(6).split('/');
    const year = /^\d{4}$/.test(parts[parts.length - 1]) && parts.length > 1 ? parseInt(parts.pop()) : null;
    const name = decodeURIComponent(parts.join('/'));
    if (name) {
      const sec = ['all','email'].includes(currentTab) ? 'sec-papers' : 'sec-' + currentTab;
      const secEl = document.getElementById(sec);
      if (secEl) secEl.classList.add('active');
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === currentTab));
      openVenue(name, year, true);
      return;
    }
  }

  // Top papers list overlay route
  if (hash === 'top') {
    if (['all','email'].includes(currentTab)) {
      document.getElementById('sec-papers').classList.add('active');
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === currentTab));
    }
    openTopList(true);
    return;
  }

  // Close overlay if navigating away from a group route
  closeOverlay(true);

  if (hash.startsWith('search?q=')) {
    const q = decodeURIComponent(hash.slice(9));
    if (q) {
      const si = document.getElementById('searchInput');
      if (document.activeElement !== si) si.value = q;
      showGlobalSearch(q, true);
      return;
    }
  }
  if (hash.startsWith('interests/')) {
    const sub = hash.slice(10);
    switchTab('interests', true);
    if (sub === 'groups' || sub === 'interests') switchIGTab(sub, true);
    return;
  }
  const tab = VALID_TABS.includes(hash) ? hash : 'all';
  switchTab(tab, true);
}
window.addEventListener('hashchange', applyHash);

/* Re-render when crossing the phone/desktop breakpoint */
let _wasPhone = window.matchMedia('(max-width: 700px)').matches;
window.addEventListener('resize', () => {
  const isPhone = window.matchMedia('(max-width: 700px)').matches;
  if (isPhone === _wasPhone) return;
  _wasPhone = isPhone;
  if (['all','email'].includes(currentTab) && !_paperViewActive) applyFilters();
  else phoneFeedOn();
}, { passive: true });

document.addEventListener('DOMContentLoaded', () => { updateLoginBtn(); loadPapers(); loadInterests(); loadGroups(); });
